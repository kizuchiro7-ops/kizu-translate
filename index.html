<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KIZU 翻訳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>KIZU 翻訳 | KIZU Chiropractic Translator</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#12232b; --ink-2:#5b7180; --line:#dde5ea;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:#e2f2f0;
  --accent:#b45309; --danger:#b91c1c; --danger-soft:#fef2f2;
  --shadow:0 1px 2px rgba(16,40,50,.06), 0 8px 24px rgba(16,40,50,.07);
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1517; --card:#161f22; --ink:#eaf2f4; --ink-2:#93a8b1; --line:#26353a;
    --brand:#2dd4bf; --brand-ink:#04241f; --brand-soft:#12312e;
    --accent:#fbbf24; --danger:#f87171; --danger-soft:#2a1414;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55; overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
header{
  padding:calc(var(--safe-t) + 10px) 14px 10px; background:var(--card);
  border-bottom:1px solid var(--line); flex:0 0 auto; position:relative; z-index:5;
}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:15px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.logo small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-2);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dirtoggle{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.dirtoggle button{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.dirtoggle button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

.searchwrap{margin-top:10px;position:relative;display:none}
.searchwrap.on{display:block}
.searchwrap input{
  width:100%;padding:11px 38px 11px 38px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg);font-size:16px;outline:none;
}
.searchwrap input:focus{border-color:var(--brand)}
.searchwrap .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:15px}
.searchwrap .sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px;color:var(--ink-2)}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}
main::-webkit-scrollbar{width:0}

/* ---------- Tab bar ---------- */
nav{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
nav button{padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2)}
nav button .ni{font-size:19px;line-height:1}
nav button .nl{font-size:10px;font-weight:600;letter-spacing:.02em}
nav button[aria-pressed="true"]{color:var(--brand)}

/* ---------- Category chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;margin:0 -12px;padding-left:12px;padding-right:12px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow)
}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- Phrase list ---------- */
.gtitle{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;margin:18px 4px 8px;text-transform:uppercase}
.gtitle:first-child{margin-top:2px}
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:13px 14px;display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%
}
.pcard:active{transform:scale(.99)}
.pcard .ptext{flex:1;min-width:0;display:block}
.pcard .pri{display:block;font-size:16px;font-weight:600;line-height:1.45}
.pcard .sec{display:block;font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.pcard .fav{flex:0 0 auto;padding:4px;font-size:16px;color:var(--line)}
.pcard .fav.on{color:var(--accent)}
.pcard .note{display:block;font-size:11.5px;color:var(--danger);margin-top:6px;font-weight:600;line-height:1.5}
.pcard.warn{border-color:var(--danger);background:var(--danger-soft)}
.pcard.warn .pri{color:var(--danger)}

.empty{text-align:center;color:var(--ink-2);font-size:14px;padding:40px 20px;line-height:1.8}

/* ---------- Big display overlay ---------- */
#show{
  position:fixed;inset:0;z-index:60;background:var(--bg);display:none;
  flex-direction:column;padding:calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 16px)
}
#show.on{display:flex}
#show .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#show .top button{padding:10px;font-size:14px;font-weight:600;color:var(--ink-2)}
.fills{display:none;gap:7px;flex-wrap:wrap;align-items:center;padding:10px 12px;margin:4px 0 2px;
  background:var(--brand-soft);border-radius:12px}
.fills.on{display:flex}
.fills .fl{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.04em}
.fills label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fills input{width:60px;padding:8px 8px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);font-size:16px;font-weight:600;text-align:right;outline:none}
.fills input:focus{border-color:var(--brand)}
#show .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow-y:auto;padding:8px 0}
.bigblock{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 18px}
.bigblock .lang{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.bigblock .lang span{flex:1}
.bigblock .txt{font-size:26px;font-weight:600;line-height:1.4;word-break:break-word}
.bigblock.mainblk{border-color:var(--brand);border-width:2px}
.bigblock.mainblk .txt{font-size:30px}
.spk{padding:8px 13px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.spk:active{opacity:.6}
#show .foot{display:flex;gap:8px}
#show .foot button{flex:1;padding:15px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;box-shadow:var(--shadow)}
#show .foot button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- AI translate ---------- */
.aibox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px}
.aibox textarea{
  width:100%;min-height:96px;border:0;background:transparent;resize:none;outline:none;font-size:17px;line-height:1.5
}
.airow{display:flex;gap:8px;align-items:center;margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.airow .grow{flex:1}
.btn{padding:11px 14px;white-space:nowrap;border-radius:11px;font-weight:700;font-size:14px;background:var(--bg);border:1px solid var(--line)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn:disabled{opacity:.45}
.mic{width:46px;height:46px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.mic.rec{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.hint{font-size:11.5px;color:var(--ink-2);margin:10px 4px 0;line-height:1.6}

.result{margin-top:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.result .lang{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--ink-2);margin-bottom:7px}
.result .txt{font-size:20px;font-weight:600;line-height:1.5;word-break:break-word}
.result .acts{display:flex;gap:8px;margin-top:12px}
.result .acts button{flex:1;padding:11px 6px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap}
.hist{margin-top:20px}
.hitem{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:7px}
.hitem .a{font-size:13px;color:var(--ink-2)}
.hitem .b{font-size:15px;font-weight:600;margin-top:3px}

/* ---------- Tools ---------- */
.tool{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.tool h3{margin:0 0 3px;font-size:15px;font-weight:700}
.tool .sub{font-size:12px;color:var(--ink-2);margin-bottom:12px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale button{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:17px;display:grid;place-items:center}
.scale button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.scalelegend{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:8px}
svg.bodychart{width:100%;height:auto;display:block;touch-action:manipulation}
svg.bodychart .zone{fill:var(--bg);stroke:var(--ink-2);stroke-width:1.2;opacity:.85}
svg.bodychart .zone.sel{fill:var(--danger);opacity:.75;stroke:var(--danger)}
svg.bodychart .lbl{fill:var(--ink-2);font-size:9px;font-weight:600;pointer-events:none}
.selout{margin-top:10px;font-size:13px;line-height:1.7;background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
.selout b{color:var(--brand)}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 76px);transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s;z-index:90;white-space:nowrap;max-width:90vw
}
#toast.on{opacity:.96;transform:translateX(-50%) translateY(0)}
.spinner{width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="logo">KIZU 翻訳<small>日本語 ⇄ English</small></div>
      <div class="dirtoggle" role="group" aria-label="翻訳の向き">
        <button id="dirStaff" aria-pressed="true">スタッフ→患者</button>
        <button id="dirPt" aria-pressed="false">患者→スタッフ</button>
      </div>
    </div>
    <div class="searchwrap" id="searchwrap">
      <span class="si">⌕</span>
      <input id="q" type="search" placeholder="日本語 / English で検索" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="sx" id="qx" aria-label="クリア">✕</button>
    </div>
  </header>

  <main id="main"></main>

  <nav role="tablist">
    <button id="tabPhrases" aria-pressed="true"><span class="ni">💬</span><span class="nl">フレーズ</span></button>
    <button id="tabAi"      aria-pressed="false"><span class="ni">✨</span><span class="nl">AI翻訳</span></button>
    <button id="tabTools"   aria-pressed="false"><span class="ni">🩺</span><span class="nl">問診ツール</span></button>
    <button id="tabFav"     aria-pressed="false"><span class="ni">★</span><span class="nl">よく使う</span></button>
  </nav>
</div>

<div id="show" role="dialog" aria-modal="true">
  <div class="top">
    <button id="showClose">✕ 閉じる</button>
    <button id="showFav">☆ よく使う</button>
  </div>
  <div class="fills" id="showFills"></div>
  <div class="body" id="showBody"></div>
  <div class="foot">
    <button id="showPrev">← 前</button>
    <button class="pri" id="showSpeak">🔊 読み上げ</button>
    <button id="showNext">次 →</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   PHRASE DATA
   ja = 日本語 / en = English / note = スタッフ向け補足(患者には表示しない)
   warn = 危険信号スクリーニング項目(赤で表示)
   ===================================================================== */
const STAFF_CATS = [
{ id:"reception", label:"受付", icon:"👋", groups:[
  { t:"あいさつ・受付", items:[
    {ja:"こんにちは。KIZUカイロプラクティックへようこそ。", en:"Hello, and welcome to KIZU Chiropractic."},
    {ja:"このアプリで通訳します。ゆっくり話してください。", en:"We'll use this app to communicate. Please speak slowly."},
    {ja:"本日はご予約をいただいていますか？", en:"Do you have an appointment today?"},
    {ja:"お名前を教えていただけますか？", en:"May I have your name, please?"},
    {ja:"こちらにお名前をご記入ください。", en:"Could you write your name here, please?"},
    {ja:"当院は初めてですか？", en:"Is this your first visit with us?"},
    {ja:"少々お待ちください。", en:"One moment, please."},
    {ja:"お待たせして申し訳ありません。", en:"I'm sorry to keep you waiting."}
  ]},
  { t:"問診票", items:[
    {ja:"問診票のご記入をお願いします。", en:"Please fill out this intake form."},
    {ja:"ご記入には10分ほどかかります。", en:"It takes about ten minutes to complete."},
    {ja:"分からないところは飛ばしてください。あとで一緒に確認します。", en:"Please skip anything that isn't clear — we'll go through it together afterwards."},
    {ja:"ご記入が終わりましたら、お声がけください。", en:"Please let us know when you've finished."},
    {ja:"生年月日をご記入ください。", en:"Please write your date of birth."},
    {ja:"日本での連絡先電話番号を教えてください。", en:"Could I have a phone number where we can reach you in Japan?"},
    {ja:"メールアドレスを教えていただけますか？", en:"May I have your email address?"}
  ]},
  { t:"保険・料金の説明", items:[
    {ja:"日本の健康保険はカイロプラクティックには使えません。自費でのお支払いになります。", en:"Japanese national health insurance does not cover chiropractic care, so payment is out of pocket."},
    {ja:"海外の保険会社に提出できる領収書をお出しできます。", en:"We can provide a receipt you can submit to your overseas insurance company."},
    {ja:"初回は問診と検査を含めて◯◯円です。", en:"The first visit, including the consultation and assessment, is ¥___."},
    {ja:"2回目以降は◯◯円です。", en:"Follow-up visits are ¥___."},
    {ja:"本日の施術時間は約◯◯分です。", en:"Today's session will take about ___ minutes."}
  ]},
  { t:"院内のご案内", items:[
    {ja:"こちらでお履き物をお脱ぎください。", en:"Please take your shoes off here."},
    {ja:"貴重品はこちらのロッカーにお入れください。", en:"Please put your valuables in this locker."},
    {ja:"お手洗いはこちらです。", en:"The restroom is this way."},
    {ja:"こちらにおかけになってお待ちください。", en:"Please have a seat and wait here."},
    {ja:"あと◯分ほどお待ちください。", en:"It will be about ___ more minutes."},
    {ja:"動きやすい服にお着替えいただけますか。更衣室はこちらです。", en:"Could you change into something comfortable to move in? The changing room is here."},
    {ja:"お着替えをお貸しできます。", en:"We can lend you a change of clothes."},
    {ja:"上着とアクセサリーを外していただけますか。", en:"Could you remove your jacket and any jewellery?"},
    {ja:"院内では携帯電話をマナーモードにしてください。", en:"Please set your phone to silent while you're in the clinic."},
    {ja:"Wi‑Fiをお使いになれます。パスワードはこちらです。", en:"You're welcome to use our Wi‑Fi. Here's the password."}
  ]}
]},

{ id:"intake", label:"問診", icon:"📋", groups:[
  { t:"主訴を聞く", items:[
    {ja:"本日はどのような症状でいらっしゃいましたか？", en:"What brings you in today?"},
    {ja:"どこが一番つらいですか？ 人体図で教えてください。", en:"Where does it bother you most? Please show me on the body chart."},
    {ja:"痛むところを指でさわってみてください。", en:"Could you point to exactly where it hurts?"},
    {ja:"つらいところは他にもありますか？", en:"Is there anywhere else that bothers you?"},
    {ja:"いつから始まりましたか？", en:"When did it start?"},
    {ja:"どのくらい続いていますか？", en:"How long have you had this?"},
    {ja:"きっかけになった出来事はありますか？（事故・スポーツ・重い物を持ったなど）", en:"Was there anything that set it off — an accident, sports, lifting something heavy?"},
    {ja:"以前にも同じ症状がありましたか？", en:"Have you had this same problem before?"},
    {ja:"だんだん良くなっていますか、悪くなっていますか、変わりませんか？", en:"Is it getting better, getting worse, or staying about the same?"}
  ]},
  { t:"痛みの性質", items:[
    {ja:"どんな痛みですか？ ズキズキ／鋭い／鈍い／焼けるような／しびれるような。", en:"How would you describe it — throbbing, sharp, dull, burning, or tingling?"},
    {ja:"痛みは他の場所に広がりますか？", en:"Does the pain spread anywhere else?"},
    {ja:"腕や脚にしびれはありますか？", en:"Do you have any numbness or pins and needles in your arms or legs?"},
    {ja:"痛みの強さを0から10で教えてください。0が痛みなし、10が想像できる最もひどい痛みです。", en:"On a scale of 0 to 10, how bad is it? 0 is no pain, 10 is the worst pain you can imagine."},
    {ja:"一日のうちで、いつが一番つらいですか？ 朝／日中／夕方／夜。", en:"When is it worst — morning, during the day, evening, or night?"},
    {ja:"どんな動きをすると痛みますか？", en:"What movements bring the pain on?"},
    {ja:"どんなときに楽になりますか？", en:"What makes it feel better?"},
    {ja:"座っているときと立っているとき、どちらがつらいですか？", en:"Is it worse sitting or standing?"},
    {ja:"咳やくしゃみで響きますか？", en:"Does coughing or sneezing make it worse?"},
    {ja:"日常生活でできなくなったことはありますか？", en:"Is there anything you can no longer do because of this?"}
  ]},
  { t:"生活背景", items:[
    {ja:"お仕事は何をされていますか？", en:"What kind of work do you do?"},
    {ja:"一日にどのくらい座っていますか？", en:"How many hours a day do you spend sitting?"},
    {ja:"パソコンやスマートフォンを使う時間は長いですか？", en:"Do you spend a lot of time on a computer or phone?"},
    {ja:"運動やスポーツはされますか？", en:"Do you exercise or play any sports?"},
    {ja:"よく眠れていますか？", en:"Are you sleeping well?"},
    {ja:"どんな姿勢で寝ていますか？ 仰向け／うつ伏せ／横向き。", en:"What position do you sleep in — on your back, front, or side?"},
    {ja:"枕やマットレスは体に合っていますか？", en:"Do your pillow and mattress suit you?"},
    {ja:"日本にはどのくらい滞在されますか？", en:"How long will you be staying in Japan?"}
  ]},
  { t:"既往歴・安全確認", items:[
    {ja:"現在、飲んでいるお薬はありますか？", en:"Are you taking any medication at the moment?"},
    {ja:"血液をサラサラにするお薬（抗凝固薬）を飲んでいますか？", en:"Are you taking any blood thinners or anticoagulants?"},
    {ja:"骨粗しょう症と言われたことはありますか？", en:"Have you ever been told you have osteoporosis?"},
    {ja:"骨折や手術を受けたことはありますか？", en:"Have you ever had a fracture or any surgery?"},
    {ja:"現在、病院にかかっていますか？", en:"Are you currently under a doctor's care?"},

/* ---------------------------------------------------------------------
   数値の差し込み（料金・分数・回数など）
   料金は施術者ごと・初回/2回目で違うので、アプリ側に固定値は持たない。
   スタッフが自分の端末で一度入力すれば、その値がそのフレーズに残る。
   日本語の ◯ と英語の ___ を同じ順番で対応させる。
   --------------------------------------------------------------------- */
const JA_SLOT = /◯+/g, EN_SLOT = /_{2,}/g;
const slotCount = (p) =>
  Math.min((p.ja.match(JA_SLOT) || []).length, (p.en.match(EN_SLOT) || []).length);

function substitute(text, re, vals){
  let i = 0;
  return text.replace(re, (m) => {
    const v = vals[i++];
    return (v === undefined || v === "") ? m : v;
  });
}
/* 表示用に値を差し込んだコピーを返す。keyOf は必ず元のフレーズに対して使うこと。 */
function filled(p){
  const n = slotCount(p);
  if (!n) return p;
  const vals = S.fill[keyOf(p)] || [];
  if (!vals.some(v => v !== undefined && v !== "")) return p;
  return { ja: substitute(p.ja, JA_SLOT, vals), en: substitute(p.en, EN_SLOT, vals), note: p.note };
}
/* 入力欄の見出し。「◯◯円」なら「円」のように、直後の助数詞を拾う。 */
function slotUnits(p){
  const units = [];
  let m;
  const re = new RegExp(JA_SLOT.source, "g");
  while ((m = re.exec(p.ja)) !== null){
    const next = p.ja.charAt(m.index + m[0].length);
    units.push(/[円月日時分回秒名個週年]/.test(next) ? next : "");
  }
  return units;
}
function setFill(p, i, value){
  const k = keyOf(p);
  const vals = (S.fill[k] || []).slice();
  vals[i] = value;
  if (vals.some(v => v !== undefined && v !== "")) S.fill[k] = vals; else delete S.fill[k];
  localStorage.setItem(LS.fill, JSON.stringify(S.fill));
}

function toast(msg, ms){

  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), ms || 1900);
}

let VOICES = [];
function loadVoices(){ try{ VOICES = speechSynthesis.getVoices() || []; }catch(e){ VOICES = []; } }
if ("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", loadVoices);
}
function pickVoice(lang){
  const want = lang === "ja" ? "ja" : "en";
  const pool = VOICES.filter(v => (v.lang||"").toLowerCase().startsWith(want));
  if (!pool.length) return null;
  /* 端末内蔵の自然な声を優先 */
  const pref = want === "ja"
    ? ["Kyoko","O-Ren","Otoya","Google 日本語","Microsoft Nanami","Microsoft Ayumi"]
    : ["Samantha","Ava","Karen","Daniel","Google US English","Microsoft Aria","Microsoft Jenny"];
  for (const name of pref){ const hit = pool.find(v => (v.name||"").includes(name)); if (hit) return hit; }
  return pool.find(v => v.localService) || pool[0];
}
function speak(text, lang){
  if (!("speechSynthesis" in window)) { toast("この端末は読み上げに対応していません"); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[◯_]{2,}|◯|＿+/g, ""));
    const v = pickVoice(lang);
    if (v) u.voice = v;
    u.lang = lang === "ja" ? "ja-JP" : "en-US";
    u.rate = lang === "ja" ? 0.95 : 0.9;   /* 患者向けにやや遅め */
    u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){ toast("読み上げに失敗しました"); }
}

function bindList(root, list){

function allPhrases(){
  const out = [];
  for (const c of cats()) for (const g of c.groups) for (const it of g.items)
    out.push(Object.assign({}, it, {_cat:c.label, _warn:!!g.warn}));
  return out;
}

  if (S.q.trim()){

      p.ja.toLowerCase().includes(q) || p.en.toLowerCase().includes(q));
    main.innerHTML = hits.length
      ? `<div class="gtitle">検索結果 ${hits.length}件</div><div class="plist" id="plist">
           ${hits.map((p,i)=>cardHTML(p,i,p._warn)).join("")}</div>`
      : `<div class="empty">「${esc(S.q)}」に一致するフレーズはありません。<br>AI翻訳タブで自由に翻訳できます。</div>`;
    if (hits.length) bindList($("#plist"), hits);
    return;
  }

  /* --- カテゴリ表示 --- */
  const cat = cs.find(c => c.id === S.cat);
  const flat = [];
  let html = `<div class="chips">${cs.map(c =>
    `<button class="chip" data-cat="${c.id}" aria-pressed="${c.id===S.cat}">${c.icon} ${esc(c.label)}</button>`
  ).join("")}</div>`;
  for (const g of cat.groups){
    html += `<div class="gtitle">${esc(g.t)}</div><div class="plist">`;
    for (const it of g.items){ flat.push(it); html += cardHTML(it, flat.length-1, !!g.warn); }

  main.innerHTML = html;
  main.querySelectorAll("[data-cat]").forEach(b =>
    b.onclick = () => { S.cat = b.dataset.cat; render(); $("#main").scrollTop = 0; });
  bindList(main, flat);
}

async function doTranslate(text){
  text = (text || "").trim();
  if (!text) { toast("翻訳する文章を入力してください"); return; }
  if (S.aiBusy) return;
  S.aiBusy = true;
  const btn = $("#aiGo"); if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try{
    const res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "X-Clinic-Key": CLINIC_KEY },
      body: JSON.stringify({ text, to: S.aiTo, context:"chiropractic_clinic" })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data.translation) throw new Error("empty");
    S.aiResult = { src:text, text:data.translation, to:S.aiTo };
    S.hist.unshift(S.aiResult);
    S.hist = S.hist.slice(0, 30);
    localStorage.setItem(LS.hist, JSON.stringify(S.hist));
    render();
    $("#aiIn").value = text;
  }catch(err){
    toast(navigator.onLine ? "翻訳に失敗しました。もう一度お試しください" : "オフラインです。フレーズ集をお使いください", 2600);
  }finally{
    S.aiBusy = false;
    const b = $("#aiGo"); if (b){ b.disabled = false; b.textContent = "翻訳"; }
  }
}

let REC = null;
function micToggle(inp){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast("この端末は音声入力に対応していません", 2400); return; }
  if (REC){ REC.stop(); return; }
  const rec = new SR();
  rec.lang = S.aiTo === "en" ? "ja-JP" : "en-US";   /* 入力言語 = 翻訳元 */
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = "";
  rec.onstart = () => { REC = rec; $("#aiMic").classList.add("rec"); toast(rec.lang === "ja-JP" ? "日本語で話してください" : "Please speak in English"); };
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    inp.value = finalText + interim;
  };
  rec.onerror = (e) => { toast(e.error === "not-allowed" ? "マイクの使用が許可されていません" : "音声入力に失敗しました", 2400); };
  rec.onend = () => { REC = null; $("#aiMic") && $("#aiMic").classList.remove("rec"); if (inp.value.trim()) doTranslate(inp.value); };
  try{ rec.start(); }catch(e){ toast("音声入力を開始できませんでした"); }
}

      <div class="selout" id="zoneOut"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn" id="zoneSpeak" style="flex:1">🔊 読み上げ</button>
        <button class="btn" id="zoneBig" style="flex:1">🔍 大きく表示</button>
      </div>
      <div style="text-align:right;margin-top:8px">
        <button id="zoneClear" style="font-size:12.5px;font-weight:600;color:var(--ink-2);padding:6px 4px">選択をクリア</button>
      </div>
    </div>

    <div class="tool">
      <h3>痛みの強さ（0〜10）</h3>
      <div class="sub">Pain scale — 患者さんにタップしてもらいます</div>
      <div class="scale" id="scale">
        ${PAIN_WORDS.map((w,i)=>`<button data-p="${i}" aria-pressed="${S.pain===i}">${i}</button>`).join("")}
      </div>
      <div class="scalelegend"><span>0 = 痛みなし / No pain</span><span>10 = 最悪 / Worst</span></div>
      <div class="selout" id="painOut"></div>
    </div>

    ${CHOICE_TOOLS.map(t => `
    <div class="tool">
      <h3>${esc(t.h)} <span style="font-weight:500;color:var(--ink-2);font-size:12px">${esc(t.hEn)}</span></h3>
      <div class="sub">${esc(t.sub)}</div>
      <button class="pcard" data-ask="${t.id}" style="margin-bottom:10px">
        <span class="ptext"><span class="pri">${esc(t.q[0])}</span><span class="sec">${esc(t.q[1])}</span></span>
        <span class="fav">🔍</span>
      </button>
      <div class="plist">
        ${t.opts.map((o,i)=>`<button class="pcard" data-opt="${t.id}:${i}">
          <span class="ptext"><span class="pri">${esc(o[0])}</span><span class="sec">${esc(o[1])}</span></span>
        </button>`).join("")}
      </div>
    </div>`).join("")}
  `;

  /* --- 人体図 --- */
  const paintZones = () => {
    const picked = [];
    main.querySelectorAll("[data-zone]").forEach(el => {
      const on = S.zones.has(el.dataset.zone);
      el.classList.toggle("sel", on);
      if (on) picked.push([el.dataset.ja, el.dataset.en]);
    });
    $("#zoneOut").innerHTML = picked.length
      ? `<b>${picked.map(p=>esc(p[0])).join("、")}</b><br>${picked.map(p=>esc(p[1])).join(", ")}`
      : `<span style="color:var(--ink-2)">まだ選択されていません / Nothing selected yet</span>`;
    return picked;
  };
  main.querySelectorAll("[data-zone]").forEach(el => el.addEventListener("click", () => {
    const id = el.dataset.zone;
    S.zones.has(id) ? S.zones.delete(id) : S.zones.add(id);
    paintZones();
  }));
  paintZones();
  const zoneText = () => {
    const p = [];
    main.querySelectorAll("[data-zone]").forEach(el => {
      if (S.zones.has(el.dataset.zone)) p.push([el.dataset.ja, el.dataset.en]);
    });
    return p;
  };
  $("#zoneClear").onclick = () => { S.zones.clear(); paintZones(); };
  $("#zoneSpeak").onclick = () => {
    const p = zoneText(); if (!p.length) return toast("部位を選んでください");
    speak(S.dir === "staff" ? p.map(x=>x[1]).join(", ") : p.map(x=>x[0]).join("、"), S.dir==="staff"?"en":"ja");
  };
  $("#zoneBig").onclick = () => {
    const p = zoneText(); if (!p.length) return toast("部位を選んでください");
    openShow([{ ja:"つらいのはこちらですね：" + p.map(x=>x[0]).join("、"),
                en:"So the problem areas are: " + p.map(x=>x[1]).join(", ") }], 0);
  };

  /* --- 痛みスケール --- */
  const paintPain = () => {
    main.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", S.pain === +b.dataset.p));
    $("#painOut").innerHTML = S.pain === null
      ? `<span style="color:var(--ink-2)">未選択 / Not selected</span>`
      : `<b>${S.pain} / 10 — ${esc(PAIN_WORDS[S.pain][0])}</b><br>${esc(PAIN_WORDS[S.pain][1])}`;
  };
  main.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { S.pain = +b.dataset.p; paintPain(); });
  paintPain();

  /* --- 選択式問診 --- */
  main.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => {
    const t = CHOICE_TOOLS.find(x => x.id === b.dataset.ask);
    openShow([{ja:t.q[0], en:t.q[1]}], 0);
  });
  main.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
    const [id, i] = b.dataset.opt.split(":");
    const t = CHOICE_TOOLS.find(x => x.id === id);
    const o = t.opts[+i];
    openShow([{ja:o[0], en:o[1]}], 0);
  });
}

/* =====================================================================
   RENDER dispatcher + wiring
   ===================================================================== */
function render(){
  $("#searchwrap").classList.toggle("on", S.tab === "phrases");
  $("#dirStaff").setAttribute("aria-pressed", S.dir === "staff");
  $("#dirPt").setAttribute("aria-pressed", S.dir === "pt");
  for (const [tab, el] of Object.entries({phrases:"#tabPhrases", ai:"#tabAi", tools:"#tabTools", fav:"#tabFav"}))
    $(el).setAttribute("aria-pressed", S.tab === tab);
  if (S.tab === "phrases") renderPhrases();
  else if (S.tab === "ai")  renderAi();
  else if (S.tab === "tools") renderTools();
  else renderFav();
}
function go(tab){ S.tab = tab; render(); $("#main").scrollTop = 0; }

$("#tabPhrases").onclick = () => go("phrases");
$("#tabAi").onclick      = () => go("ai");
$("#tabTools").onclick   = () => go("tools");
$("#tabFav").onclick     = () => go("fav");
$("#dirStaff").onclick   = () => { S.dir = "staff"; S.cat = null; localStorage.setItem(LS.dir, S.dir); render(); };
$("#dirPt").onclick      = () => { S.dir = "pt";    S.cat = null; localStorage.setItem(LS.dir, S.dir); render(); };
$("#q").addEventListener("input", e => { S.q = e.target.value; renderPhrases(); });
$("#qx").onclick = () => { $("#q").value = ""; S.q = ""; renderPhrases(); };

$("#showClose").onclick = closeShow;
$("#showPrev").onclick  = () => { if (S.show.i > 0){ S.show.i--; renderShow(); } };
$("#showNext").onclick  = () => { if (S.show.i < S.show.list.length-1){ S.show.i++; renderShow(); } };
$("#showSpeak").onclick = () => {
  const f = filled(S.show.list[S.show.i]);
  speak(S.dir === "staff" ? f.en : f.ja, S.dir === "staff" ? "en" : "ja");
};
$("#showFav").onclick = () => { toggleFav(S.show.list[S.show.i]); renderShow(); render(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeShow(); });

/* 大きく表示中のスワイプで前後移動 */
(function(){
  let x0 = null;
  const el = $("#show");
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) < 60) return;
    if (dx < 0 && S.show.i < S.show.list.length-1){ S.show.i++; renderShow(); }
    if (dx > 0 && S.show.i > 0){ S.show.i--; renderShow(); }
  }, {passive:true});
})();

render();

/* Service worker (オフライン動作) */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
